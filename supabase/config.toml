-- Levantine Arabic corpus (local CLI defaults)
-- Link a remote project with: npx supabase link --project-ref <ref>

project_id = "arabic-corpus"

[api]
enabled = true

[db]
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
# Create the sole user in the dashboard (or during initial setup), then keep signup off.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

